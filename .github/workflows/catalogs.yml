name: Update Catalogs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-catalogs]

permissions: read-all

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  update-catalogs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_GHA_PAT }}

      - name: Gather supported distributions and imageTypes
        id: get_env
        run: |
          DISTROS=$(sed -n '/variable "distributions"/,/}/ { s/^[[:space:]]*"\([^"]*\)".*/\1/p }' docker-bake.hcl | paste -sd, -)
          IMAGE_TYPES=$(sed -n '/variable "imageTypes"/,/}/ { s/^[[:space:]]*"\([^"]*\)".*/\1/p }' docker-bake.hcl | paste -sd, -)
          echo "distributions=$DISTROS" >> "$GITHUB_OUTPUT"
          echo "image_types=$IMAGE_TYPES" >> "$GITHUB_OUTPUT"

      - name: Generate catalogs
        uses: cloudnative-pg/postgres-containers/.github/actions/generate-catalogs@main
        with:
          output-dir: image-catalogs/
          registry: ghcr.io/cloudnative-pg/postgis
          family: postgis
          distributions: ${{ steps.get_env.outputs.distributions }}
          image-types: ${{ steps.get_env.outputs.image_types }}
          regex: '(\d+)(?:\.\d+|beta\d+|rc\d+|alpha\d+)-(\d+(?:\.\d+){1,3})-(\d{12})'

      - name: Diff
        run: |
          git add -A .
          git status
          git diff --staged

      - name: Temporarily disable "include administrators" branch protection
        if: always() && github.ref == 'refs/heads/main'
        id: disable_include_admins
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.REPO_GHA_PAT }}
          script: |
            const params = {
              owner: 'cloudnative-pg',
              repo: 'postgis-containers',
              branch: 'main',
            };
            const { data } = await github.rest.repos.getAdminBranchProtection(params);
            core.setOutput('initial_status', data.enabled);
            if (data.enabled) {
              await github.rest.repos.deleteAdminBranchProtection(params);
            }

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          add: 'image-catalogs/*.yaml'
          author_name: CloudNativePG Automated Updates
          author_email: noreply@cnpg.com
          message: 'chore: update imageCatalogs'

      - name: Restore "include administrators" branch protection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: |
          always() &&
          github.ref == 'refs/heads/main' &&
          steps.disable_include_admins.outputs.initial_status == 'true'
        with:
          github-token: ${{ secrets.REPO_GHA_PAT }}
          script: |
            await github.rest.repos.setAdminBranchProtection({
              owner: 'cloudnative-pg',
              repo: 'postgis-containers',
              branch: 'main',
            });
